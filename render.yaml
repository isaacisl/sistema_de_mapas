services:
  - type: web
    name: cnm-sistema-de-mapas
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: MPLCONFIGDIR
        value: /tmp/matplotlib
